services:
  - type: web
    name: courier-api
    runtime: python
    plan: free
    # A 12 MB compressed OSM snapshot is versioned with the demo. This avoids
    # depending on the public Overpass API whenever Render rebuilds.
    buildCommand: pip install -r requirements.txt && gzip --decompress --keep data/osm/monterrey_drive.graphml.gz && python -m scripts.compact_osm_graph
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
